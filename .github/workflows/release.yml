name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
            executable: fewman-type--${{ github.ref_name }}-win-x64.exe
          - target: i686-pc-windows-msvc
            os: windows-latest
            ext: zip
            executable: fewman-type-${{ github.ref_name }}-win-x86.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: zip
            executable: fewman-type-${{ github.ref_name }}-win-aarch64.exe
          # macOS
          - target: x86_64-apple-darwin
            os: macos-13
            ext: tar.gz
            executable: fewman-type-${{ github.ref_name }}-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
            executable: fewman-type-${{ github.ref_name }}-darwin-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target\${{ matrix.target }}\release
          7z a ../../../fewman-type-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }} ${{ matrix.executable }}
        shell: cmd

      - name: Archive (macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../fewman-type-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }} ${{ matrix.executable }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fewman-type-${{ matrix.target }}
          path: fewman-type-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
